<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аренда Автовышки | Гомель</title>
    <style>
        :root {
            --main-bg: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent: #1a1a1a;
            --secondary: #6c757d;
            --border: #e9ecef;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--main-bg);
            background-image: radial-gradient(#d1d5db 0.5px, transparent 0.5px);
            background-size: 24px 24px; /* Легкая сетка на фоне */
            color: var(--accent);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        /* Анимация */
        @keyframes reveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            animation: reveal 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 60px 40px 40px;
        }

        header h1 {
            font-size: 2.8em;
            margin: 0;
            font-weight: 800;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .top-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .top-info span {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Главное изображение */
        .hero-box {
            padding: 0 40px;
        }

        .hero-img {
            width: 100%;
            border-radius: 30px;
            cursor: zoom-in;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .hero-img:hover {
            transform: scale(1.02);
        }

        /* Сетка характеристик и цены */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: var(--border);
            margin-top: 40px;
            border-top: 1px solid var(--border);
        }

        .detail-item {
            background: white;
            padding: 40px;
        }

        .detail-item h3 {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--secondary);
            margin-bottom: 20px;
        }

        .price-text {
            font-size: 1.8em;
            font-weight: 700;
        }

        .price-subtext {
            display: block;
            font-size: 0.5em;
            color: var(--secondary);
            font-weight: 400;
            margin-top: 5px;
        }

        /* Галерея */
        .gallery-section {
            padding: 40px;
            background: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 15px;
        }

        .gallery-grid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            cursor: zoom-in;
            filter: grayscale(20%);
            transition: all 0.4s ease;
        }

        .gallery-grid img:hover {
            filter: grayscale(0%);
        }

        /* Подвал */
        .footer {
            padding: 60px 40px;
            text-align: center;
            background: #fafafa;
        }

        .phone-link {
            display: inline-flex;
            align-items: center;
            font-size: 2em;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            margin-top: 20px;
            transition: opacity 0.3s;
        }

        .phone-link:hover {
            opacity: 0.7;
        }

        .viber-btn-img {
            width: 40px;
            height: 40px;
            margin-right: 15px;
        }

        /* Лайтбокс */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 85%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .details-grid, .gallery-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 2em; }
            .phone-link { font-size: 1.4em; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lb-img" src="">
    </div>

    <div class="container">
        <div class="glass-card">
            
            <header>
                <div class="top-info">
                    <span>Гомель и область</span>
                    <span>Без выходных</span>
                </div>
                <h1>Аренда Автовышки</h1>
            </header>

            <div class="hero-box">
                <img src="car.png" class="hero-img" onclick="view(this.src)" alt="Автовышка 22м">
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <h3>Характеристики</h3>
                    <div style="font-weight: 600;">
                        Высота подъема: 22 метра<br>
                        Грузоподъемность: 300 кг<br>
                        Стрела: Коленчатая
                    </div>
                </div>
                <div class="detail-item">
                    <h3>Стоимость</h3>
                    <div class="price-text">
                        Договорная
                        <span class="price-subtext">Минимальный заказ: 4 часа</span>
                    </div>
                </div>
            </div>

            <div class="gallery-section">
                <h3 style="font-size: 0.75em; text-transform: uppercase; letter-spacing: 2px; color: var(--secondary); margin-bottom: 20px;">Галерея</h3>
                <div class="gallery-grid">
                    <img src="work1.jpg" onclick="view(this.src)">
                    <img src="work2.jpg" onclick="view(this.src)">
                </div>
            </div>

            <div class="footer">
                <span style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8em; color: var(--secondary);">Свяжитесь с нами</span><br>
                <a href="tel:+375291870965" class="phone-link">
                    <img src="viber-logo-viber-logo-transparent-viber-icon-transparent-free-free-png.webp" class="viber-btn-img">
                    +375 29 187 09 65
                </a>
            </div>

        </div>
    </div>

    <script>
        function view(src) {
            document.getElementById('lb-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
    </script>

</body>
</html>
